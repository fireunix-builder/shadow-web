name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private source branch, tag, or commit"
        required: true
        default: "main"
        type: string
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string
      publish:
        description: "Publish to Cloudflare R2 and a GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build production frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out public builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: builder

      - name: Check out private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fireunix-app/shadow-web
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Validate private source tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          tag_sha="$(git -C source rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${source_sha}" != "${tag_sha}" ]]; then
            echo "::error::Release tag does not match the private source revision."
            exit 1
          fi

      - name: Build and package
        shell: bash
        env:
          VERSION_NUMBER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          private_log="${RUNNER_TEMP}/private-build.log"
          set +e
          (
            set -euo pipefail
            version="${VERSION_NUMBER#v}"
            archive="shadow-web-${version}-web"
            package_dir="dist/${archive}"

            npm --prefix source ci --no-audit --no-fund
            npm --prefix source run build
            test -f source/dist/index.html
            if find source/dist -type f -name '*.map' -print -quit | grep -q .; then
              exit 1
            fi

            mkdir -p "${package_dir}"
            cp -R source/dist "${package_dir}/dist"
            install -m 0644 builder/README.md "${package_dir}/README.md"
            tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
            (cd dist && sha256sum "${archive}.tar.gz" > SHA256SUMS)
            rm -rf source "${package_dir}"
          ) >"${private_log}" 2>&1
          status=$?
          set -e
          rm -f "${private_log}"
          if (( status != 0 )); then
            echo "::error::Private source build failed; detailed output was intentionally withheld."
            exit "${status}"
          fi

      - name: Store release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-web-release
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Install release tools
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSLo /tmp/awscliv2.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi

      - name: Upload release artifacts to Cloudflare R2
        if: inputs.publish
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is not configured}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is not configured}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is not configured}"
          : "${R2_BUCKET:?R2_BUCKET is not configured}"
          : "${R2_PUBLIC_URL:?R2_PUBLIC_URL is not configured}"

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="Web/${RELEASE_TAG}"
          public_url="${R2_PUBLIC_URL%/}"
          version="${RELEASE_TAG#v}"
          file="shadow-web-${version}-web.tar.gz"
          sha="$(awk -v file="${file}" '{ name=$2; sub(/^.*\//, "", name); if (name == file) { print $1; exit } }' dist/SHA256SUMS)"
          test -n "${sha}"

          aws s3 sync dist "s3://${R2_BUCKET}/${prefix}/" \
            --endpoint-url "${endpoint}" \
            --exclude "*" \
            --include "*.tar.gz" \
            --include "SHA256SUMS" \
            --cache-control "public,max-age=0,must-revalidate" \
            --only-show-errors

          jq -n \
            --arg version "${RELEASE_TAG}" \
            --arg released_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg url "${public_url}/${prefix}/${file}" \
            --arg sha256 "${sha}" \
            --arg checksums_url "${public_url}/${prefix}/SHA256SUMS" \
            '{
              version: $version,
              released_at: $released_at,
              files: {
                web: {url: $url, sha256: $sha256}
              },
              checksums_url: $checksums_url
            }' > dist/latest.json

          aws s3 cp dist/latest.json "s3://${R2_BUCKET}/Web/latest.json" \
            --endpoint-url "${endpoint}" \
            --content-type "application/json" \
            --cache-control "no-cache,max-age=0" \
            --only-show-errors

      # A short-lived installation token of the fireunix-publisher GitHub App,
      # scoped to the private repository the release is created in.
      - name: Create release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: fireunix-app
          repositories: shadow-web
          permission-contents: write

      - name: Publish GitHub Release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.version }}
          TARGET_REPOSITORY: fireunix-app/shadow-web
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?release token was not created}"
          [[ "${TARGET_REPOSITORY}" == fireunix-app/* ]]
          [[ "$(gh api "repos/${TARGET_REPOSITORY}" --jq '.private')" == "true" ]]
          if ! gh api "repos/${TARGET_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag must already exist in the private source repository."
            exit 1
          fi
          assets=(dist/*.tar.gz dist/SHA256SUMS)
          if gh release view "${RELEASE_TAG}" --repo "${TARGET_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --clobber \
              --repo "${TARGET_REPOSITORY}"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            "${assets[@]}" \
            --repo "${TARGET_REPOSITORY}" \
            --verify-tag \
            --title "Shadow Web ${RELEASE_TAG}" \
            --notes "Production frontend built from the configured private source ref."
